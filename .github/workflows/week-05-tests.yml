name: Week 05 Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week-05/partner-lead-aid-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-05/partner-lead-aid-main/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test